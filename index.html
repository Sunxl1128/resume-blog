  <!--
    主题前置脚本：在样式生效前确定深浅色，避免刷新时闪白。
    优先级：localStorage 记忆 > prefers-color-scheme > 默认深色。
    这是行为逻辑而非简历内容，所有简历内容仍集中在 data/resume.js。
  -->
  <script>
    (function () {
      var theme = "dark";
      try {
        var saved = window.localStorage.getItem("resume-theme");
        if (saved === "light" || saved === "dark") {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          theme = "light";
        }
      } catch (e) {
        theme = "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
